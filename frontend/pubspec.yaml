name: deallus_frontend
description: "Desktop-first Flutter app for Deallus AI orchestrator - Claude Desktop style UI"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  riverpod: ^3.3.2
  flutter_riverpod: ^3.3.2
  riverpod_generator: ^4.0.4
  state_notifier: ^1.0.0

  # HTTP & Networking
  dio: ^5.4.0
  retrofit: ^4.1.0
  json_serializable: ^6.7.0
  json_annotation: ^4.9.0

  # Local Storage & Security
  flutter_secure_storage: ^10.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0

  # Navigation & Routing
  go_router: ^17.3.0

  # UI & Desktop
  flutter_adaptive_scaffold: ^0.3.3+1
  window_manager: ^0.5.2

  # Markdown & Text Rendering
  flutter_markdown: ^0.7.7+1
  markdown: ^7.1.0
  syntax_highlight: ^0.5.0

  # Audio & Media
  record: ^7.1.1
  permission_handler: ^12.0.3

  # File Handling
  file_picker: ^11.0.2
  mime: ^2.0.0
  file_saver: ^0.4.0

  # Code Generation & Utilities
  build_runner: ^2.4.6

  # Logging & Debugging
  logger: ^2.0.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Testing (removed to resolve version conflicts with build_runner)
  mockito: ^5.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
