version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: aidi_postgres
    environment:
      POSTGRES_USER: aidi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidi_secure_password}
      POSTGRES_DB: aidi
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidi -d aidi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aidi_network
    restart: unless-stopped

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: aidi_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_MODELS: /root/.ollama/models
    networks:
      - aidi_network
    restart: unless-stopped
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 120s

  # Redis Cache (optional, for future use)
  redis:
    image: redis:7-alpine
    container_name: aidi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aidi_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AIDI Backend API
  aidi_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aidi_api
    environment:
      DATABASE_URL: postgresql://aidi:${POSTGRES_PASSWORD:-aidi_secure_password}@postgres:5432/aidi
      OLLAMA_BASE_URL: http://ollama:11434
#      TEXT_MODEL: ollama/llama3.2:8b
#      CLASSIFIER_MODEL: ollama/llama3.2:3b
      TEXT_MODEL: ollama/llama2
      CLASSIFIER_MODEL: ollama/llama2
      DEBUG: ${DEBUG:-true}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
#      ollama:
#        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - aidi_network
    restart: unless-stopped
    command: python run.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
  redis_data:
    driver: local

networks:
  aidi_network:
    driver: bridge
